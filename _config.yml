# Site settings
title: "Tanmoy Roy"
description: "Senior Data Scientist | AI/ML Researcher | PhD"
url: "https://tan-res-space.github.io"
baseurl: "/my-profile"
author:
  name: "Tanmoy Roy"
  email: "tanmoy.main@gmail.com"
  linkedin: "https://www.linkedin.com/in/tanmoy-roy-328b592b"
  scholar: "https://scholar.google.com/citations?user=FweJmHYAAAAJ&hl=en"
  github: "https://github.com/tan-res-space"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  publications:
    output: false

# Exclude from build
exclude:
  - cv_source/
  - Gemfile
  - Gemfile.lock
  - README.md
  - Makefile
  - node_modules/
  - .github/
  - linkedin_ops/
  - .cursor/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "pages"
    values:
      layout: "page"
