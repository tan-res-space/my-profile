<header class="site-header">
  <div class="container header-inner">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <button class="menu-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
      <a href="{{ '/pages/cv' | relative_url }}" {% if page.url contains '/cv' %}class="active"{% endif %}>CV</a>
      <a href="{{ '/pages/research' | relative_url }}" {% if page.url contains '/research' %}class="active"{% endif %}>Research</a>
      <a href="{{ '/pages/blog' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a>
      <a href="{{ '/pages/contact' | relative_url }}" {% if page.url contains '/contact' %}class="active"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
