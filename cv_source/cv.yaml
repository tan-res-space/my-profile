# Single source of truth for all CV versions.
#
# To add a new version:
#   1. Copy an entry under `profiles` and give it a new id (filename becomes cv_<id>.tex).
#   2. Set `summary` (a key in `summaries`), `tags` (which tagged blocks to include),
#      and `detail` (`full` or `brief`).
#   3. Run: python3 render_cv.py
#
# Tags used on content blocks:
#   industry  — industry roles (always included in current profiles)
#   research  — academic/research roles and sections
#   training  — training/teaching roles and sections
# Blocks with no tags are included in every version.
#
# Optional profile keys:
#   detail_by_tag      — override detail (full/brief) per content tag
#   education_detail   — full/brief for the education section
#   experience_order   — employer ids to show first; remaining keep YAML order
#   section_order      — body section ids after summary

