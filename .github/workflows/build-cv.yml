name: Build CV PDFs

on:
  push:
    branches: [ main ]
    paths:
      - 'cv_source/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Generate LaTeX from YAML
      run: |
        pip install -r cv_source/requirements.txt
        python3 cv_source/render_cv.py --self-test
        python3 cv_source/render_cv.py

    - name: Build Detailed CV (Full)
      uses: xu-cheng/latex-action@v3
      with:
        root_file: cv_detailed.tex
        working_directory: cv_source/
        latexmk_use_xelatex: false
        args: -pdf -interaction=nonstopmode

    - name: Build Industry CV
      uses: xu-cheng/latex-action@v3
      with:
        root_file: cv_industry.tex
        working_directory: cv_source/
        latexmk_use_xelatex: false
        args: -pdf -interaction=nonstopmode

    - name: Build Brief CV
      uses: xu-cheng/latex-action@v3
      with:
        root_file: cv_brief.tex
        working_directory: cv_source/
        latexmk_use_xelatex: false
        args: -pdf -interaction=nonstopmode

    - name: Build No-Research CV
      uses: xu-cheng/latex-action@v3
      with:
        root_file: cv_noresearch.tex
        working_directory: cv_source/
        latexmk_use_xelatex: false
        args: -pdf -interaction=nonstopmode

    - name: Build Educationist CV
      uses: xu-cheng/latex-action@v3
      with:
        root_file: cv_educationist.tex
        working_directory: cv_source/
        latexmk_use_xelatex: false
        args: -pdf -interaction=nonstopmode

    - name: Copy PDFs to cv_builds
      run: |
        mkdir -p cv_builds
        python3 cv_source/render_cv.py --list | tr ' ' '\n' | while read -r version; do
          cp "cv_source/cv_${version}.pdf" cv_builds/
        done

    - name: Commit and push updated PDFs
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add cv_builds/*.pdf
        git diff --cached --quiet || git commit -m "Auto-build CV PDFs [skip ci]"
        git push
